<a class="book-card" href="/كتب/{{ work.slug }}">
  <span class="cover">{% include "partials/jacket.html" %}</span>
  <span class="book-body">
    <span class="book-title">{{ work.title }}</span>
    <span class="book-author">{{ primary_author(work) }}</span>
    <span class="book-meta">
      {% set cat = primary_category(work) %}
      {% if cat %}{{ cat.name_ar }}{% endif %}
      {% set fmts = formats_of(work) %}
      {% if fmts %}{% if cat %} · {% endif %}{{ fmts|join(' · ')|upper }}{% endif %}
    </span>
  </span>
</a>
