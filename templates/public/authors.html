{% extends "base.html" %}
{% block title %}المؤلفون — مكتبة أبو علياء الرقمية{% endblock %}
{% block content %}
<div class="wrap page-block">
  <header class="page-head"><h1>دليل المؤلفين</h1></header>
  <form class="filters" method="get">
    <input type="search" name="q" value="{{ q }}" placeholder="ابحث عن مؤلف">
    <button class="btn" type="submit">بحث</button>
  </form>
  <div class="cats">
    {% for a in authors %}
      <a class="cat-chip" href="/مؤلفون/{{ a.slug }}"><strong>{{ a.canonical_name }}</strong></a>
    {% endfor %}
  </div>
  {% if not authors %}<div class="empty">لا مؤلفين مطابقين.</div>{% endif %}
</div>
{% endblock %}
