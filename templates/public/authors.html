{% extends "base.html" %}
{% block title %}المؤلفون — مكتبة أبو علياء الرقمية{% endblock %}
{% block content %}
<div class="wrap page">
  <header class="page-head"><h1>المؤلفون</h1></header>
  <form class="filters" method="get">
    <input type="search" name="q" value="{{ q }}" placeholder="ابحث عن مؤلف" aria-label="بحث عن مؤلف">
    <button class="btn quiet" type="submit">بحث</button>
  </form>
  {% if authors %}
  <ul class="cat-list names">
    {% for a in authors %}
      <li><a href="/مؤلفون/{{ a.slug }}">{{ a.canonical_name }}</a></li>
    {% endfor %}
  </ul>
  {% else %}
  <div class="empty">لا مؤلفين مطابقين.</div>
  {% endif %}
</div>
{% endblock %}
