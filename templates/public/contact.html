{% extends "base.html" %}
{% block title %}تواصل معنا — مكتبة أبو علياء الرقمية{% endblock %}
{% block content %}
<div class="wrap page-block">
  <h1>تواصل معنا</h1>
  {% if sent %}
    <div class="notice">وصلت رسالتك. شكراً لك.</div>
  {% else %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <p><label>الاسم<br><input type="text" name="الاسم" required></label></p>
    <p><label>البريد<br><input type="email" name="البريد"></label></p>
    <p><label>الرسالة<br><textarea name="الرسالة" required></textarea></label></p>
    <button class="btn" type="submit">إرسال</button>
  </form>
  {% endif %}
</div>
{% endblock %}
