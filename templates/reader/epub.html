<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>قراءة {{ work.title }}</title>
  <link rel="stylesheet" href="/static/css/library.css">
</head>
<body class="reader-shell">
  <div class="reader-bar">
    <a href="/كتب/{{ work.slug }}">رجوع</a>
    <div>{{ work.title }}</div>
    <div>
      <button type="button" id="prev">السابق</button>
      <button type="button" id="next">التالي</button>
      <button type="button" id="smaller" aria-label="تصغير الخط">أ−</button>
      <button type="button" id="bigger" aria-label="تكبير الخط">أ+</button>
      <button type="button" id="theme">ليلي</button>
      <a href="/ملفات/{{ work.slug }}/epub?dl=1">تنزيل</a>
    </div>
  </div>
  <div class="reader-stage" id="epub-view"></div>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  <script>
    const key = "epub-progress:{{ work.slug }}";
    const book = ePub("/ملفات/{{ work.slug }}/epub");
    const rendition = book.renderTo("epub-view", { width: "100%", height: "100%", flow: "paginated", dir: "rtl" });
    let fs = Number(localStorage.getItem(key + ":fs") || 100);
    let night = localStorage.getItem(key + ":night") === "1";
    const dayTheme = { body: { direction: "rtl", textAlign: "right", background: "#f6f1e8", color: "#1a2332", fontSize: "18px", lineHeight: "1.9" }};
    const nightTheme = { body: { direction: "rtl", textAlign: "right", background: "#121821", color: "#e8e0d4", fontSize: "18px", lineHeight: "1.9" }};
    function applyTheme() {
      rendition.themes.default(night ? nightTheme : dayTheme);
      rendition.themes.fontSize(fs + "%");
      document.body.classList.toggle("night", night);
      document.getElementById("theme").textContent = night ? "نهاري" : "ليلي";
    }
    applyTheme();
    const saved = localStorage.getItem(key);
    rendition.display(saved || undefined);
    rendition.on("relocated", (loc) => {
      if (loc && loc.start && loc.start.cfi) localStorage.setItem(key, loc.start.cfi);
    });
    document.getElementById("next").onclick = () => rendition.next();
    document.getElementById("prev").onclick = () => rendition.prev();
    document.getElementById("bigger").onclick = () => { fs = Math.min(fs + 10, 180); localStorage.setItem(key + ":fs", fs); rendition.themes.fontSize(fs + "%"); };
    document.getElementById("smaller").onclick = () => { fs = Math.max(fs - 10, 80); localStorage.setItem(key + ":fs", fs); rendition.themes.fontSize(fs + "%"); };
    document.getElementById("theme").onclick = () => {
      night = !night;
      localStorage.setItem(key + ":night", night ? "1" : "0");
      applyTheme();
    };
  </script>
</body>
</html>
